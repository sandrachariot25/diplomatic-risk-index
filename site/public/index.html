<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korea–Japan Risk Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Diplomatic Risk Index: Korea–Japan tension index, 3-month flare-up risk from scheduled triggers, and the underlying statistics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: an app shell with three tabs. Monitor = bento of verdict cards, one wide chart, then reasons;
   Statistics = watchlist on the left, detail on the right; Method = long-form page. */
/* Palette "Iris & Aqua": iris-violet accent with an aqua second stop, soft mesh background, liquid-glass surfaces. */
:root {
  --bg: #eef0f8; --surface: #ffffff; --surface-2: rgba(255,255,255,.55); --border: rgba(20,24,60,.09); --ink: #0e1124; --muted: #565d76; --faint: #8a90a8;
  --accent: #5b5bf6; --accent-2: #17bfc7; --accent-soft: rgba(91,91,246,.12); --on-accent: #ffffff;
  --glass: rgba(255,255,255,.56); --glass-hi: rgba(255,255,255,.85); --glass-edge: rgba(255,255,255,.75);
  --shadow: 0 10px 30px rgba(36,40,110,.09), 0 2px 6px rgba(36,40,110,.05);
  --blob1: rgba(124,131,253,.38); --blob2: rgba(61,214,208,.30); --blob3: rgba(255,170,130,.26);
  --high: #e5484d; --high-soft: #fdecec; --watch: #d98a0b; --watch-soft: #fdf3e1; --normal: #7d8794; --normal-soft: #eef0f3;
  --tense: #e5484d; --calm: #3a7bd5; --good: #12a06a;
  --t-courts: #2a78d6; --t-heritage: #eb6834; --t-econ: #1baf7a; --t-other: #898781;
  --sans: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: var(--sans);
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090a14; --surface: #151729; --surface-2: rgba(255,255,255,.05); --border: rgba(255,255,255,.09); --ink: #eceefa; --muted: #9ea3bf; --faint: #6d7290;
  --accent: #8b8cff; --accent-2: #3de0d8; --accent-soft: rgba(139,140,255,.16); --on-accent: #0b0c1a;
  --glass: rgba(30,33,58,.52); --glass-hi: rgba(255,255,255,.14); --glass-edge: rgba(255,255,255,.12);
  --shadow: 0 12px 34px rgba(0,0,0,.40), 0 2px 6px rgba(0,0,0,.25);
  --blob1: rgba(108,110,255,.30); --blob2: rgba(40,200,195,.20); --blob3: rgba(230,110,160,.16);
  --high: #ff6b6f; --high-soft: #3a1a1c; --watch: #f2b544; --watch-soft: #36290f; --normal: #9aa3b0; --normal-soft: #1f242d;
  --tense: #ff6b6f; --calm: #5d9cea; --good: #3cc492;
  --t-courts: #5d9cea; --t-heritage: #f08a5c; --t-econ: #3cc492; --t-other: #a3a19c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #090a14; --surface: #151729; --surface-2: rgba(255,255,255,.05); --border: rgba(255,255,255,.09); --ink: #eceefa; --muted: #9ea3bf; --faint: #6d7290;
  --accent: #8b8cff; --accent-2: #3de0d8; --accent-soft: rgba(139,140,255,.16); --on-accent: #0b0c1a;
  --glass: rgba(30,33,58,.52); --glass-hi: rgba(255,255,255,.14); --glass-edge: rgba(255,255,255,.12);
  --shadow: 0 12px 34px rgba(0,0,0,.40), 0 2px 6px rgba(0,0,0,.25);
  --blob1: rgba(108,110,255,.30); --blob2: rgba(40,200,195,.20); --blob3: rgba(230,110,160,.16);
  --high: #ff6b6f; --high-soft: #3a1a1c; --watch: #f2b544; --watch-soft: #36290f; --normal: #9aa3b0; --normal-soft: #1f242d;
  --tense: #ff6b6f; --calm: #5d9cea; --good: #3cc492;
  --t-courts: #5d9cea; --t-heritage: #f08a5c; --t-econ: #3cc492; --t-other: #a3a19c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14.5px/1.5 var(--sans); margin: 0; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* app bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; gap: 18px; height: 60px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.logo .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 600 11px var(--mono); letter-spacing: .02em; }
.logo small { color: var(--muted); font-weight: 400; font-size: 13px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; margin-left: 8px; }
.tabs a { padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
.bar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: transparent; padding: 4px 9px; border-radius: 999px; font: 500 12px var(--mono); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

main { padding-block: 22px 48px; }
.view[hidden] { display: none !important; }
.grid { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
.card .sub { color: var(--muted); margin: 4px 0 0; font-size: 13.5px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.label { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; }

/* hero */
.hero { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "hr hn hn" "risk k1 k2"; row-gap: 10px; }
.hero .hh-risk { grid-area: hr; } .hero .hh-now { grid-area: hn; } .hero .risk { grid-area: risk; }
.hero .kpi:nth-of-type(1) { grid-area: k1; } .hero .kpi:nth-of-type(2) { grid-area: k2; }
.hh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 2px 6px; border-bottom: 2px solid var(--ink); font-size: 15px; font-weight: 600; }
.hh span { font-size: 13px; font-weight: 400; color: var(--muted); }
.hh-risk { border-bottom-color: var(--accent); }
.risk { display: flex; flex-direction: column; gap: 14px; }
.risk h1 { font-size: clamp(28px, 3.6vw, 38px); line-height: 1.12; font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.risk .why { color: var(--muted); margin: 0; max-width: 62ch; font-size: 15px; }
.now { background: var(--high-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
.now b { color: var(--high); }
.now span { color: var(--muted); display: block; margin-top: 4px; font-size: 13.5px; }
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: auto; }
.meter div { height: 6px; border-radius: 3px; background: var(--normal-soft); }
.meter-l { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 12px; color: var(--faint); margin-top: -8px; }
.meter-l span.on { color: var(--ink); font-weight: 500; }
.kpi { display: flex; flex-direction: column; gap: 8px; }
.kpi .big { font-size: 40px; font-weight: 600; line-height: 1.05; }
.kpi .big small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .delta { font-size: 14px; color: var(--ink); }
.scale { margin-top: auto; padding-top: 8px; }
.scale .track { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--calm), var(--normal-soft) 50%, var(--tense)); }
.scale .band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 4px; }
.scale .mk { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.scale .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.scale.news .track { background: var(--normal-soft); }

/* month bar */
.monthbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.ctl:disabled { opacity: .35; cursor: default; }
select.ctl { padding-right: 26px; }
.chips { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); }
.chips button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border); }

/* charts */
.chart-box { position: relative; }
svg.chart { width: 100%; display: block; overflow: visible; touch-action: pan-y; }
svg.chart.click { cursor: crosshair; }
svg text { fill: var(--faint); font: 400 11.5px var(--sans); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.legend i.bar { border-radius: 2px; width: 14px; height: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-width: 270px; z-index: 3; }
.tip .mono { color: var(--muted); }

/* lists */
.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
ul.rows { list-style: none; margin: 0; padding: 0; }
ul.rows > li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); align-items: baseline; }
ul.rows > li:first-child { border-top: 0; padding-top: 2px; }
ul.rows .when { color: var(--muted); }
.kind { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 5px; margin-right: 8px; vertical-align: 1px; }
.kind.court { background: var(--high-soft); color: var(--high); }
.kind.heritage { background: var(--watch-soft); color: var(--watch); }
.kind.recurring, .kind.election { background: var(--normal-soft); color: var(--muted); }
.empty { color: var(--muted); margin: 0; }
.subcard { margin-top: 18px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; }
.subcard h3 { font-size: 13.5px; font-weight: 600; margin: 0 0 6px; }
.subcard li { padding: 7px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.subcard li:first-child { border-top: 0; }
.verdict-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.vc-hit { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.vc-miss { background: var(--high-soft); color: var(--high); }
.vc-wait { background: var(--normal-soft); color: var(--muted); }
.outcome { margin-top: 14px; display: grid; gap: 10px; }
.outcome .ep { padding: 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
.outcome .ep p { margin: 6px 0 0; }
.outcome .ep .cause { color: var(--muted); font-size: 13.5px; }

/* layers */
.layers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 36px; }
.lg { font-size: 13px; font-weight: 600; color: var(--muted); padding: 12px 0 4px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 132px 44px 16px; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; font-size: 13.5px; border: 0; background: transparent; text-align: left; width: calc(100% + 16px); }
button.lrow { cursor: pointer; }
button.lrow:hover { background: var(--surface-2); }
.lrow .track { position: relative; height: 10px; }
.lrow .track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border); }
.lrow .b { position: absolute; top: 0; height: 10px; border-radius: 3px; }
.lrow .val { text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lrow .go { color: var(--faint); font-size: 13px; }
.lrow.na { color: var(--faint); }

/* evidence */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.who { min-width: 150px; }
td .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.sev { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sev i { width: 7px; height: 7px; border-radius: 50%; }
.acts li { grid-template-columns: 88px 14px minmax(0, 1fr) !important; }
.dir-esc { color: var(--high); } .dir-coo { color: var(--good); } .dir-neu { color: var(--faint); }

/* statistics view */
.stats { grid-template-columns: 370px minmax(0, 1fr); align-items: start; }
.watch { padding: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 100px); overflow: auto; }
.search { width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px; padding: 8px 10px; font: inherit; color: var(--ink); margin-bottom: 6px; }
.wg { font-size: 13px; font-weight: 600; color: var(--muted); padding: 12px 8px 4px; }
.wi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.wi:hover { background: var(--surface-2); }
.wi[aria-current="true"] { background: var(--accent-soft); }
.wi .n { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.wi svg { width: 64px; height: 22px; display: block; }
.wi .v { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.detail .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.detail h2 { font-size: 22px; }
.detail .big { font-size: 36px; font-weight: 600; line-height: 1.1; margin-top: 10px; }
.detail .big small { font-size: 15px; font-weight: 500; color: var(--muted); }
.detail .cmp { color: var(--muted); font-size: 13px; margin-top: 4px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: 11px; margin-top: 18px; }
.facts div { padding: 12px 14px; }
.facts div + div { border-left: 1px solid var(--border); }
.facts b { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }
.desc { margin: 18px 0 0; max-width: 72ch; }
.srcline { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.copy { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 500; }
.recent { margin-top: 18px; }

/* economy */
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis .card { padding: 16px 18px; }
.kpis .big { font-size: 28px; font-weight: 600; margin-top: 6px; }
.kpis .delta { font-size: 13px; color: var(--muted); margin-top: 2px; }
table.sectors td.bar { width: 22%; min-width: 120px; }
.sbar { display: flex; align-items: center; gap: 8px; }
.sbar span.t { flex: 1; height: 8px; background: var(--normal-soft); border-radius: 4px; position: relative; overflow: hidden; }
.sbar span.f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.sbar b { font-weight: 500; font-size: 13px; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.chg-up, .chg-dn { color: var(--muted); white-space: nowrap; }
table.sectors td { white-space: nowrap; } table.sectors td:first-child { white-space: normal; min-width: 150px; }
.goods { display: flex; flex-wrap: wrap; gap: 6px; }
.goods button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.goods button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.files li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--border); list-style: none; }
.files { padding: 0; margin: 10px 0 0; }
.files li:first-child { border-top: 0; }
.files .note { display: block; }

/* method */
.method { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.prose h2 { font-size: 24px; letter-spacing: -.02em; margin-bottom: 12px; }
.prose h3 { font-size: 15px; margin: 22px 0 6px; }
.prose p { margin: 0 0 12px; max-width: 70ch; }
.rates { display: grid; gap: 10px; margin: 12px 0 8px; }
.rate { display: grid; grid-template-columns: 96px minmax(0, 1fr) 42px; gap: 10px; align-items: center; font-size: 13.5px; }
.rate .track { height: 12px; background: var(--normal-soft); border-radius: 4px; position: relative; }
.rate .fill { display: block; height: 100%; border-radius: 4px; }
.rate .base { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); }
.srclist li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; list-style: none; }
.srclist { padding: 0; margin: 0; }
footer { color: var(--muted); font-size: 12.5px; padding-block: 8px 32px; }

@media (max-width: 1000px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "hr hr" "risk risk" "hn hn" "k1 k2"; }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .watch { position: static; max-height: 360px; }
  .logo small, .live span { display: none; }
}
@media (max-width: 760px) {
  .two, .method, .layers { grid-template-columns: minmax(0, 1fr); }
  .bar .wrap { height: auto; flex-wrap: wrap; padding-block: 10px; gap: 10px; }
  .tabs { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .tabs a { flex: 1 0 auto; text-align: center; padding: 6px 9px; font-size: 13px; }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .facts div:nth-child(3) { border-left: 0; }
  .facts div:nth-child(n+3) { border-top: 1px solid var(--border); }
}
@media (max-width: 480px) {
  .card { padding: 16px; }
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hr" "risk" "hn" "k1" "k2"; }

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('month').addEventListener('change', e => { cur = e.target.value; render(); });
$('fav-month').addEventListener('click', () => { toggleFav('months', cur); $('fav-month').setAttribute('aria-pressed', String(isFav('months', cur))); $('fav-month').innerHTML = starHtml(isFav('months', cur)); });
$('prev').addEventListener('click', () => { const i = MS.indexOf(cur); if (i > 0) { cur = MS[i - 1]; render(); } });
$('next').addEventListener('click', () => { const i = MS.indexOf(cur); if (i < MS.length - 1) { cur = MS[i + 1]; render(); } });
$('range').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; range = b.dataset.r; $('range').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderMainChart(); });
$('layers').addEventListener('click', e => { const b = e.target.closest('[data-stat]'); if (b) { statId = b.dataset.stat; view = 'data'; render(); window.scrollTo(0, 0); } });
$('watch').addEventListener('click', e => { const b = e.target.closest('[data-stat]'); if (b) { statId = b.dataset.stat; render(); } });
$('q').addEventListener('input', e => { query = e.target.value; renderWatch(); });
$('e-metric').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { eMetric = b.dataset.m; renderEconomy(); } });
$('e-range').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { eRange = b.dataset.r; renderEconomy(); } });
$('e-goods').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { goodsCode = b.dataset.g; renderEconomy(); } });
const chart = $('chart'), tip = $('tip');
chart.addEventListener('mousemove', evt => {
  const i = hoverIndex(chart, evt), m = chart._sub[i], e = D.episodes[m.m];
  showTip(chart, tip, i, `<span class="mono">${esc(mName(m.m))}</span><br>${esc(t('kIndex'))}: <b>${Math.round(m.idx)}</b> · ${esc(t('risk')[m.risk])}` + (e ? `<br><span style="color:${typeVar(e.type)}">●</span> ${esc(e[lang][0])}` : ''));
});
chart.addEventListener('mouseleave', () => hideTip(chart, tip));
chart.addEventListener('click', evt => { cur = chart._sub[hoverIndex(chart, evt)].m; render(); });
window.addEventListener('hashchange', route);
let rz, lastW = 0; const ro = new ResizeObserver(es => { const w = Math.round(es[0].contentRect.width); if (w === lastW) return; lastW = w; clearTimeout(rz); rz = setTimeout(() => { if (view === 'monitor') renderMainChart(); if (view === 'data') renderDetail(); if (view === 'economy') renderEconomy(); }, 100); });
ro.observe(document.querySelector('main'));
applyStatic(); route();
</script>
